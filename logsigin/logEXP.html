<body class="__className_f367f3">


    <div class="neural-background"></div>

    <!-- Formes Géométriques Flottantes -->
    <div class="geometric-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Lignes de Réseau de Neurones -->
    <div class="neural-lines">
        <div class="neural-line"></div>
        <div class="neural-line"></div>
        <div class="neural-line"></div>
    </div>




    <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8 shadow-2xl"
        style="opacity: 1; transform: none;">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h2>BIENVENNU A TOUS</h2>
                    <p>Commencez votre voyage dans le monde de l'agriculture intelligente.</p>
                </div>

                <form class="login-form" id="loginForm" novalidate>
                    <input type="hidden" name="role" value="expert">
                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="text" id="nom" name="nom" required autocomplete="nom">
                            <label for="nom">Nom complet </label>
                            <span class="focus-border"></span>
                        </div>
                        <span class="error-message" id="nomError"></span>
                    </div>


                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="tel" id="phone" name="phone" required autocomplete="tel">
                            <label for="phone">Numéro de Téléphone </label>
                            <span class="focus-border"></span>
                        </div>
                        <span class="error-message" id="phoneError"></span>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="text" id="localisation" name="localisation" required
                                autocomplete="localisation">
                            <label for="localisation">Localisation </label>
                            <span class="focus-border"></span>
                        </div>
                        <span class="error-message" id="localisationError"></span>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="email" id="email" name="email" required autocomplete="email">
                            <label for="email">Email </label>
                            <span class="focus-border"></span>
                        </div>
                        <span class="error-message" id="emailError"></span>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper password-wrapper">
                            <input type="password" id="password" name="password" required
                                autocomplete="current-password">
                            <label for="password">Mot de passe</label>
                            <button type="button" class="password-toggle" id="passwordToggle"
                                aria-label="Toggle password visibility">
                                <span class="eye-icon"></span>
                            </button>
                            <span class="focus-border"></span>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="number" id="code" name="code" required autocomplete="off">
                            <label for="code">Code </label>
                            <span class="focus-border"></span>
                        </div>
                        <span class="error-message" id="codeError"></span>
                    </div>

                    <div class="form-options">
                        <label class="remember-wrapper">
                            <button type="submit" class="login-btn btn">
                                <span class="btn-text">S'inscrire</span>
                                <span class="btn-loader"></span>
                            </button>
                            <div class="signup-link">
                                <a href="login.html">vous etes un agriculteur</a>
                            </div>
                    </div>


                </form>


                <div class="signup-link">
                    <p>Vous avez un compte? <a href="sign.html">j'ai un compte</a></p>
                </div>

                <div class="success-message" id="successMessage">
                    <div class="success-icon">✓</div>
                    <h3>Login Successful!</h3>
                    <p>Redirecting to your dashboard...</p>
                </div>
            </div>
        </div>





        </form>
    </div>
    <script src="login.js"></script>

</body>
