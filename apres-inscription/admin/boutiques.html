<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Boutiques — Admin Agrosence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/components/navbar.js"></script>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .page-wrapper { max-width: 1300px; margin: 0 auto; padding: 30px 40px; font-family: 'Inter', sans-serif; }
        .page-header { margin-bottom: 35px; animation: fadeSlideUp 0.8s ease forwards; }
        .page-header h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, #1a1a2e, #166534, #15803d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 6px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-box { background: rgba(255,255,255,0.8); backdrop-filter: blur(15px); padding: 20px; border-radius: 18px; border: 2px solid rgba(21,128,61,0.1); }
        .stat-box h3 { font-size: 1.5rem; color: #15803d; margin-bottom: 4px; }
        .stat-box p { color: rgba(0,0,0,0.5); font-size: 0.85rem; font-weight: 600; }

        .toolbar { display: flex; gap: 15px; margin-bottom: 20px; }
        .search-input { flex: 1; padding: 12px 20px; border-radius: 12px; border: 2px solid rgba(21,128,61,0.1); background: rgba(255,255,255,0.8); outline: none; }

        .table-container { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border-radius: 20px; border: 2px solid rgba(21,128,61,0.1); overflow: hidden; }
        .b-table { width: 100%; border-collapse: collapse; }
        .b-table th { text-align: left; padding: 15px 20px; background: rgba(21,128,61,0.05); font-size: 0.8rem; color: rgba(0,0,0,0.4); text-transform: uppercase; }
        .b-table td { padding: 15px 20px; border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 0.9rem; }
        
        .shop-name { font-weight: 700; color: #1a1a2e; }
        .owner-info { display: flex; align-items: center; gap: 10px; }
        .owner-info .avatar { width: 30px; height: 30px; border-radius: 8px; background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
        
        .tag { padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; }
        .tag-spec { background: rgba(21,128,61,0.1); color: #15803d; }
        
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* وضع مظلم فاخر (Dark Green Neural Theme) */
        body.dark-mode {
            background: radial-gradient(circle at 15% 85%, rgba(129, 243, 186, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 85% 15%, rgba(130, 233, 164, 0.15) 0%, transparent 50%),
                        linear-gradient(to bottom, #06130b 0%, #0a1910 100%) !important;
            color: #ffffff !important;
        }
        body.dark-mode .neural-background {
            display: none !important;
        }
        body.dark-mode .page-header h1 {
            background: linear-gradient(135deg, #ffffff, #81f3ba, #10b981) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
        }
        body.dark-mode .page-header p {
            color: rgba(255, 255, 255, 0.7) !important;
        }
        body.dark-mode .stat-box {
            background: rgba(15, 35, 25, 0.85) !important;
            border-color: rgba(129, 243, 186, 0.2) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
        }
        body.dark-mode .stat-box h3 {
            color: #81f3ba !important;
        }
        body.dark-mode .stat-box p {
            color: rgba(255, 255, 255, 0.5) !important;
        }
        body.dark-mode .search-input {
            background: rgba(15, 35, 25, 0.8) !important;
            border-color: rgba(129, 243, 186, 0.25) !important;
            color: #ffffff !important;
        }
        body.dark-mode .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4) !important;
        }
        body.dark-mode .table-container {
            background: rgba(15, 35, 25, 0.85) !important;
            border-color: rgba(129, 243, 186, 0.2) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
        }
        body.dark-mode .b-table th {
            background: rgba(129, 243, 186, 0.05) !important;
            color: rgba(255, 255, 255, 0.6) !important;
            border-bottom: 2px solid rgba(129, 243, 186, 0.15) !important;
        }
        body.dark-mode .b-table td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: #ffffff !important;
        }
        body.dark-mode .shop-name {
            color: #ffffff !important;
        }
        body.dark-mode .tag-spec {
            background: rgba(129, 243, 186, 0.1) !important;
            color: #81f3ba !important;
            border: 1px solid rgba(129, 243, 186, 0.2) !important;
        }
        body.dark-mode .b-table tbody tr:hover {
            background: rgba(129, 243, 186, 0.04) !important;
        }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>
    <div class="neural-background"></div>
    <div id="navbar-container"></div>

    <div class="page-wrapper">
        <div class="page-header">
            <h1 data-i18n="Gestion des Boutiques">🏪 Gestion des Boutiques</h1>
            <p data-i18n="Liste des experts ayant configuré une boutique sur Agrosence">Liste des experts ayant configuré une boutique sur Agrosence</p>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="Rechercher une boutique ou un expert...">
        </div>

        <div class="table-container">
            <table class="b-table">
                <thead>
                    <tr>
                        <th data-i18n="Boutique">Boutique</th>
                        <th data-i18n="Expert / Propriétaire">Expert / Propriétaire</th>
                        <th data-i18n="Spécialité">Spécialité</th>
                        <th data-i18n="Wilaya">Wilaya</th>
                        <th data-i18n="Description">Description</th>
                    </tr>
                </thead>
                <tbody id="boutiqueBody">
                    <tr><td colspan="5" style="text-align:center; padding:50px; color:rgba(0,0,0,0.3)" data-i18n="Chargement des boutiques...">Chargement des boutiques...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allExperts = [];
        
        async function loadBoutiques() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch('/api/user/all/expert', { headers: { 'x-auth-token': token } });
                const experts = await res.json();
                
                // Filter only experts with a boutique name
                allExperts = experts.filter(e => e.boutique && e.boutique.name && e.boutique.name.trim() !== '');
                
                renderStats(allExperts);
                renderTable(allExperts);
            } catch (err) {
                console.error(err);
            }
        }

        function renderStats(list) {
            const specs = {};
            list.forEach(e => {
                const s = e.boutique.specialty || 'Général';
                specs[s] = (specs[s] || 0) + 1;
            });

            const container = document.getElementById('statsGrid');
            container.innerHTML = `
                <div class="stat-box"><h3>${list.length}</h3><p>Boutiques Actives</p></div>
                ${Object.entries(specs).slice(0,3).map(([s, c]) => `
                    <div class="stat-box"><h3>${c}</h3><p>${s}</p></div>
                `).join('')}
            `;
        }

        function renderTable(list) {
            const body = document.getElementById('boutiqueBody');
            if (list.length === 0) {
                body.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:50px;">Aucune boutique trouvée</td></tr>';
                return;
            }

            body.innerHTML = list.map(e => `
                <tr>
                    <td><span class="shop-name">${e.boutique.name}</span></td>
                    <td>
                        <div class="owner-info">
                            <div class="avatar">${e.nom[0]}</div>
                            <span>${e.nom}</span>
                        </div>
                    </td>
                    <td><span class="tag tag-spec">${e.boutique.specialty || 'Général'}</span></td>
                    <td>${e.boutique.wilaya || e.localisation}</td>
                    <td style="color:rgba(0,0,0,0.5); font-size:0.8rem;">${e.boutique.description || '—'}</td>
                </tr>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allExperts.filter(ex => 
                ex.boutique.name.toLowerCase().includes(q) || 
                ex.nom.toLowerCase().includes(q) || 
                (ex.boutique.specialty && ex.boutique.specialty.toLowerCase().includes(q))
            );
            renderTable(filtered);
        });

        loadBoutiques();
    </script>
    <script src="../../components/translations.js"></script>
<script src="../../components/i18n.js"></script>

</body>
</html>
