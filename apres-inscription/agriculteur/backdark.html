<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrosence | Dark Mode Background</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #06130b;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .neural-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            /* Chbab Dark Mode - Deep Dark with a subtle white light leak */
            background: 
                radial-gradient(circle at 50% -20%, rgba(255, 255, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 15% 85%, rgba(129, 243, 186, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 15%, rgba(130, 233, 164, 0.1) 0%, transparent 50%),
                linear-gradient(to bottom, #06130b 0%, #020604 100%) !important;
            animation: backgroundPulse 14s ease-in-out infinite;
        }

        @keyframes backgroundPulse {
            0%, 100% { filter: brightness(0.9) saturate(1.2) hue-rotate(0deg); }
            50% { filter: brightness(1.05) saturate(1.4) hue-rotate(5deg); }
        }

        .geometric-shapes { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .shape { 
            position: absolute; 
            border: 1px solid rgba(130, 233, 164, 0.2); 
            animation: floatShape 20s linear infinite; 
        }
        .shape:nth-child(1) { width: 100px; height: 100px; left: 10%; }
        .shape:nth-child(2) { width: 60px; height: 60px; left: 70%; border-radius: 50%; }
        .shape:nth-child(3) { width: 80px; height: 80px; left: 30%; transform: rotate(45deg); }
        .shape:nth-child(4) { width: 120px; height: 120px; left: 50%; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); background: rgba(130, 233, 164, 0.05); }

        @keyframes floatShape {
            from { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10%, 90% { opacity: 1; }
            to { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        .neural-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .neural-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(129, 243, 186, 0.3), transparent);
            height: 2px; width: 100%;
            animation: neuralPulse 3s ease-in-out infinite;
        }
        .neural-line:nth-child(1) { top: 20%; }
        .neural-line:nth-child(2) { top: 60%; }
        .neural-line:nth-child(3) { top: 40%; }

        @keyframes neuralPulse {
            0%, 100% { opacity: 0.1; transform: scaleX(0.5); }
            50% { opacity: 0.4; transform: scaleX(1); }
        }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .particle { position: absolute; width: 3px; height: 3px; background: rgba(129, 243, 186, 0.4); border-radius: 50%; animation: floatParticle linear infinite; }

        @keyframes floatParticle {
            0% { transform: translateY(100vh); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="neural-background"></div>

    <div class="geometric-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <div class="neural-lines">
        <div class="neural-line"></div>
        <div class="neural-line"></div>
        <div class="neural-line"></div>
    </div>
    
    <div class="particles" id="particles"></div>

    <!-- Theme Toggle Button -->
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        <button id="themeToggle" style="background: #ffffff; color: #06130b; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: 600; box-shadow: 0 4px 15px rgba(255,255,255,0.2); display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-sun"></i> Light Mode
        </button>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; z-index: 1;">
        <h1 style="color: #ffffff; font-size: 3rem;">Agrosence Dark</h1>
        <p style="color: #81f3ba; font-size: 1.2rem;">نظام الزراعة الذكية - الوضع الليلي</p>
    </div>

    <script src="theme-manager.js"></script>
    <script>
        document.getElementById('themeToggle').addEventListener('click', () => {
            toggleAgrosenceTheme();
        });

        // Particles Generation
        const container = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (7 + Math.random() * 10) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(p);
        }
    </script>
</body>
</html>
