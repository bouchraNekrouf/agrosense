<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Espace | Agrosence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* التصميم الأساسي للخلفية الأصلية (Mode Asli) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            overflow-x: hidden;
        }

        .neural-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: radial-gradient(circle at 15% 85%, rgba(129, 243, 186, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 85% 15%, rgba(130, 233, 164, 0.12) 0%, transparent 50%),
                        linear-gradient(135deg, #ffffff 0%, #f0fdf4 50%, #ffffff 100%);
            animation: backgroundPulse 14s ease-in-out infinite;
        }

        @keyframes backgroundPulse {
            0%, 100% { filter: brightness(1) saturate(1); }
            33% { filter: brightness(1.02) saturate(1.2); }
            66% { filter: brightness(1.01) saturate(1.1); }
        }

        /* الأشكال الهندسية */
        .geometric-shapes { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .shape { position: absolute; border: 1px solid rgba(130, 233, 164, 0.3); animation: floatShape 20s linear infinite; }
        .shape:nth-child(1) { width: 100px; height: 100px; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 60px; height: 60px; left: 70%; animation-delay: -5s; border-radius: 50%; }
        .shape:nth-child(3) { width: 80px; height: 80px; left: 30%; animation-delay: -10s; transform: rotate(45deg); }
        .shape:nth-child(4) { width: 120px; height: 120px; left: 50%; animation-delay: -15s; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); background: rgba(130, 233, 164, 0.05); }

        @keyframes floatShape {
            from { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10%, 90% { opacity: 1; }
            to { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* خطوط النيورال */
        .neural-lines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .neural-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(129, 243, 186, 0.4), transparent);
            height: 2px; width: 100%;
            animation: neuralPulse 3s ease-in-out infinite;
        }
        .neural-line:nth-child(1) { top: 20%; animation-delay: 0s; }
        .neural-line:nth-child(2) { top: 60%; animation-delay: -1s; }
        .neural-line:nth-child(3) { top: 40%; animation-delay: -2s; }

        @keyframes neuralPulse {
            0%, 100% { opacity: 0.1; transform: scaleX(0.5); }
            50% { opacity: 0.4; transform: scaleX(1); }
        }

        /* الجزيئات الطائرة */
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .particle { position: absolute; width: 4px; height: 4px; background: rgba(74, 222, 128, 0.5); border-radius: 50%; animation: floatParticle linear infinite; }

        @keyframes floatParticle {
            0% { transform: translateY(100vh); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="neural-background"></div>
    <div class="geometric-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <div class="neural-lines">
        <div class="neural-line"></div>
        <div class="neural-line"></div>
        <div class="neural-line"></div>
    </div>
    <div class="particles" id="particles"></div>

    <!-- Theme Toggle Button -->
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        <button id="themeToggle" style="background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: 600; box-shadow: 0 4px 15px rgba(16,185,129,0.3); display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-moon"></i> Dark Mode
        </button>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; z-index: 1;">
        <h1 style="color: #06130b; font-size: 3rem;">Agrosence Light</h1>
        <p style="color: #334155; font-size: 1.2rem;">نظام الزراعة الذكية - الوضع الأصلي</p>
    </div>

    <script src="theme-manager.js"></script>
    <script>
        document.getElementById('themeToggle').addEventListener('click', () => {
            toggleAgrosenceTheme();
        });

        // Particles Generation
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            p.style.width = (2 + Math.random() * 4) + 'px';
            p.style.height = p.style.width;
            container.appendChild(p);
        }
    </script>
</body>
</html>
